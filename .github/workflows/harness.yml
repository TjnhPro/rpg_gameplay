name: RPG Gameplay Harness
on:
  push:
  pull_request:

jobs:
  verify:
    name: Foundation (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        node: ['22', '24']
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Pin npm tooling
        run: npm install --global npm@12.2.0
      - name: Rebuild pinned Core artifact
        run: npm run core:prepare
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Run gates
        run: npm run verify
