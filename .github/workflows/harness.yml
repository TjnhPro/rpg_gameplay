name: RPG Gameplay Harness
on:
  push:
  pull_request:

jobs:
  verify:
    name: Harness & functional gate (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Install dependencies when lockfile exists
        run: |
          if [ -f package-lock.json ]; then
            npm ci --ignore-scripts
          fi
      - name: Run gates
        run: npm run verify
