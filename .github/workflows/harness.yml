name: RPG Gameplay MVP
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Pin npm tooling
        run: npm install --global npm@12.2.0
      # No Core artifact cache: rebuild once per job and check lockfile SHA-512.
      - name: Prepare and validate pinned Core artifact
        run: npm run core:prepare
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Verify
        run: npm run verify
